# Tool settings for the TechStore Phase 0 code. Read by ruff and pytest, locally and in CI.

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Pyflakes (real bugs: undefined names, unused imports), pycodestyle errors,
# import order, and a few bug-prone patterns.
select = ["F", "E", "W", "I", "B"]
ignore = [
    "E731",  # small lambdas assigned to names are used deliberately in scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # tests add the project folder to sys.path before importing it
# These two files hold complete HTML pages as Python strings; long lines are the page markup.
"grading_view.py" = ["E501"]
"grading_hosted.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
