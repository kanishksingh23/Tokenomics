[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics"
version = "0.1.0"
description = "Cut LLM tokens and cost without making answers worse: techniques and an OpenAI-compatible gateway"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# The embedding model (FAQ shortcut, response cache) and the gateway server.
embeddings = ["sentence-transformers>=3.0.0"]
gateway = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "openai>=3.0"]
tracing = ["langfuse>=5.0"]

[tool.setuptools]
packages = ["tokenomics"]
