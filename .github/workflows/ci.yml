name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint, tests, data (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: techstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../tokenomics ../tests
      - name: Unit tests (no API calls)
        run: python -m pytest
      - name: Gateway tests (in-process, stand-in provider)
        run: python -m pytest ../tests -q
      - name: Data integrity
        run: python validate_data.py

  cache-safety:
    name: cache safety suite (real embedding model)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: techstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU torch and sentence-transformers
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install sentence-transformers numpy -e ..
      - name: Adversarial pairs must never share an answer (fails on any false hit)
        run: python cache_safety.py

  docker:
    name: docker build + health check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f techstore/Dockerfile -t techstore .
      - name: Container answers a question (mock mode, no key)
        run: |
          docker run --rm techstore python cli.py --mock "Can I return opened headphones?" | tail -6
      - name: Streamlit health check
        run: |
          docker run -d --name ts -p 8501:8501 techstore
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs ts
          exit 1
      - name: Gateway health check (mock provider)
        run: |
          docker run -d --name gw -p 8000:8000 -e TOKENOMICS_UPSTREAM=mock techstore \
            uvicorn tokenomics.gateway:create_app --factory --host 0.0.0.0 --port 8000
          for i in $(seq 1 45); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs gw
          exit 1
